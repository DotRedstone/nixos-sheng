# ---
# Module: Kernel Build Workflow
# Description: GitHub Actions workflow to build the Linux kernel
# Scope: CI
# ---

name: Build Sheng Kernel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: true

jobs:
  build:
    name: Build Mobile NixOS boot image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Validate generation menu renderer
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            build './nixos#checks.aarch64-linux.generationMenuRenderer' \
            --no-link

      - name: Build boot image
        run: |
          set -o pipefail

          build_log="$(mktemp)"

          set +e
          nix --extra-experimental-features "nix-command flakes" \
            build ./nixos#mobileAndroidBootimg \
            --out-link out/mobile-bootimg 2>&1 | tee "$build_log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "===== nix build failed; collecting diagnostics ====="

            linux_drv="$(grep -oE '/nix/store/[^ ]+-linux-[^ ]+\.drv' "$build_log" | tail -1 || true)"
            echo "linux drv: ${linux_drv:-not found}"

            if [ -n "$linux_drv" ]; then
              diag_pattern='=====|---|CONFIG_IO_URING|CONFIG_EXT4_FS|CONFIG_BLK_DEV_INITRD|CONFIG_DEVTMPFS|CONFIG_TMPFS|CONFIG_KERNEL_MODE_NEON|CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_KUSER_HELPERS|CONFIG_BRIDGE|CONFIG_BRIDGE_NETFILTER|CONFIG_NF_TABLES|CONFIG_NETFILTER_XTABLES|CONFIG_IP6_NF_IPTABLES|CONFIG_NETFILTER|olddefconfig|oldconfig|nix-wrapped compiler|unknown type name|fatal error| error:|Error [0-9]+|Makefile:'

              echo "===== linux drv diagnostic excerpts ====="
              nix log "$linux_drv" 2>&1 | grep -nE "$diag_pattern" | tail -300 || true

              echo "===== linux drv last 500 lines ====="
              nix log "$linux_drv" 2>&1 | tail -500 || true
            fi

            exit "$status"
          fi

          mkdir -p out/kernel
          cp out/mobile-bootimg out/kernel/boot_sheng_nixos.img

          image_size="$(stat -c '%s' out/kernel/boot_sheng_nixos.img)"
          boot_b_size=$((0xC000000))
          echo "boot image size: $image_size bytes"
          echo "boot_b size: $boot_b_size bytes"
          if [ "$image_size" -gt "$boot_b_size" ]; then
            echo "ERROR: boot image exceeds sheng boot_b partition"
            exit 1
          fi

      - name: Package matching kernel modules
        run: |
          set -euo pipefail

          nix --extra-experimental-features "nix-command flakes" \
            build \
            './nixos#nixosConfigurations.sheng.config.boot.kernelPackages.kernel' \
            --out-link out/kernel-package

          kernel_version="$(
            nix --extra-experimental-features "nix-command flakes" \
              eval \
              './nixos#nixosConfigurations.sheng.config.boot.kernelPackages.kernel.modDirVersion' \
              --raw
          )"
          modules_dir="out/kernel-package/lib/modules/$kernel_version"
          test -d "$modules_dir"

          tar -C out/kernel-package/lib/modules \
            -czf "out/kernel/sheng-linux-$kernel_version-modules.tar.gz" \
            "$kernel_version"

          grep -qxF 'CONFIG_INPUT_FPC1552=y' out/kernel-package/build.config || {
              echo "ERROR: FPC1552 fingerprint resource driver is not built in"
              exit 1
            }

          sha256sum out/kernel/* > out/kernel/sha256sums.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheng-mobile-nixos-boot
          path: out/kernel/
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Sheng Mobile NixOS boot ${{ github.run_number }}"
          files: out/kernel/boot_sheng_nixos.img
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
