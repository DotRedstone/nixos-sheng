name: Build Sheng Kernel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel branch suffix, for example 7.1"
        required: true
        default: "7.1"

jobs:
  build:
    name: Build kernel ${{ github.event.inputs.kernel_version }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-sheng-kernel-${{ github.event.inputs.kernel_version }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-sheng-kernel-${{ github.event.inputs.kernel_version }}-
            ${{ runner.os }}-sheng-kernel-

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache clang flex git libelf-dev \
            busybox cpio gzip libssl-dev lld llvm wget xz-utils zstd
          ccache --set-config=max_size=10G
          ccache --set-config=cache_dir=/home/runner/.ccache

      - name: Build kernel
        run: |
          chmod +x sheng-kernel_build.sh
          bash sheng-kernel_build.sh "${{ github.event.inputs.kernel_version }}" "${{ github.workspace }}"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheng-kernel-${{ github.event.inputs.kernel_version }}
          path: |
            out/kernel/*.img
            out/kernel/*.tar.zst
            out/kernel/*.cpio.gz
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.event.inputs.kernel_version }}
          name: "Sheng kernel ${{ github.event.inputs.kernel_version }}"
          files: |
            out/kernel/*.img
            out/kernel/*.tar.zst
            out/kernel/*.cpio.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
