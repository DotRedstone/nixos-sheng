name: Build Sheng Kernel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: false

jobs:
  build:
    name: Build Mobile NixOS boot image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build boot image
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            build ./nixos#mobileAndroidBootimg \
            --out-link out/mobile-bootimg
          mkdir -p out/kernel
          cp out/mobile-bootimg out/kernel/boot_sheng_nixos.img

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheng-mobile-nixos-boot
          path: out/kernel/boot_sheng_nixos.img
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Sheng Mobile NixOS boot ${{ github.run_number }}"
          files: out/kernel/boot_sheng_nixos.img
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
