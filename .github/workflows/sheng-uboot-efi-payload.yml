name: Build Sheng U-Boot EFI payload

on:
  push:
    branches:
      - exp/uboot-efi
    paths:
      - nixos/flake.nix
      - nixos/packages/sheng-uboot-efi-esp.nix
      - nixos/modules/sheng-uboot-efi.nix
      - nixos/configuration.nix
      - nixos/hardware/mobile.nix
      - nixos/modules/sheng-boot-animation.nix
      - nixos/patches/stage-1-boot-animation.rb
      - nixos/patches/stage-1-early-charge-guard.rb
      - nixos/patches/stage-1-headless-generation-menu.rb
      - nixos/packages/sheng-boot-animation.nix
      - nixos/packages/sheng-boot-animation.h
      - nixos/packages/build-boot-animation.py
      - nixos/packages/sheng-fb-painter.c
      - nixos/packages/sheng-fb-painter.nix
      - nixos/scripts/sheng-efi-generations.sh
      - nixos/hardware/xiaomi-sheng/**
      - .github/workflows/sheng-uboot-efi-payload.yml
  pull_request:
    paths:
      - nixos/flake.nix
      - nixos/packages/sheng-uboot-efi-esp.nix
      - nixos/modules/sheng-uboot-efi.nix
      - nixos/configuration.nix
      - nixos/hardware/mobile.nix
      - nixos/modules/sheng-boot-animation.nix
      - nixos/patches/stage-1-boot-animation.rb
      - nixos/patches/stage-1-early-charge-guard.rb
      - nixos/patches/stage-1-headless-generation-menu.rb
      - nixos/packages/sheng-boot-animation.nix
      - nixos/packages/sheng-boot-animation.h
      - nixos/packages/build-boot-animation.py
      - nixos/packages/sheng-fb-painter.c
      - nixos/packages/sheng-fb-painter.nix
      - nixos/scripts/sheng-efi-generations.sh
      - nixos/hardware/xiaomi-sheng/**
      - .github/workflows/sheng-uboot-efi-payload.yml
  workflow_dispatch:
    inputs:
      build_full_stage2:
        description: Build the complete minimal stage-2 closure (release preflight)
        required: false
        default: false
        type: boolean

jobs:
  validate-stage2-integration:
    name: Evaluate EFI update tool in minimal rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Evaluate the installed stage-2 closure
        run: |
          nix eval --raw \
            ./nixos#nixosConfigurations.sheng-minimal.config.system.build.toplevel.drvPath

  build-full-minimal-stage2:
    name: Build complete minimal stage-2 closure
    if: github.event_name == 'workflow_dispatch' && inputs.build_full_stage2
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build the complete stage-2 closure
        run: |
          nix build ./nixos#nixosConfigurations.sheng-minimal.config.system.build.toplevel \
            --no-link \
            --print-build-logs

  build-efi-payload:
    name: Build and validate EFI payload
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build and validate immutable ESP tree
        run: |
          nix build ./nixos#shengUbootEfiEsp \
            --print-build-logs \
            --out-link out/sheng-uboot-efi-esp
          test -s out/sheng-uboot-efi-esp/esp/EFI/BOOT/BOOTAA64.EFI
          entry=$(find out/sheng-uboot-efi-esp/esp/loader/entries \
            -maxdepth 1 -type f -name 'nixos-sheng-*.conf' -print -quit)
          test -n "$entry"
          grep -Fx "default $(basename "$entry")" out/sheng-uboot-efi-esp/esp/loader/loader.conf
          (cd out/sheng-uboot-efi-esp/esp && sha256sum -c manifest.sha256)
          kernel_identity=$(find out/sheng-uboot-efi-esp/esp/EFI/NixOS \
            -name kernel.store-path -type f -print -quit)
          test -n "$kernel_identity"
          printf 'EFI payload kernel closure: '
          cat "$kernel_identity"
          sha256sum out/sheng-uboot-efi-esp/esp/manifest.sha256 > out/sheng-uboot-efi-esp.manifest.sha256
          printf '%s\n' "$GITHUB_SHA" > out/sheng-uboot-efi-esp.source-revision
      - name: Upload validated EFI payload
        uses: actions/upload-artifact@v4
        with:
          name: sheng-uboot-efi-esp
          path: |
            out/sheng-uboot-efi-esp
            out/sheng-uboot-efi-esp.manifest.sha256
            out/sheng-uboot-efi-esp.source-revision
          if-no-files-found: error

  build-menu-clear-probe:
    name: Build menu clear-screen probe
    if: github.ref_name == 'codex/exp-systemd-boot-no-clear'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build AA64 EFI manager
        run: |
          nix build ./nixos#shengSystemdBootNoClear \
            --print-build-logs \
            --out-link out/sheng-systemd-boot-no-clear
          sha256sum out/sheng-systemd-boot-no-clear/BOOTAA64.EFI \
            > out/sheng-systemd-boot-no-clear.sha256
          printf '%s\n' "$GITHUB_SHA" \
            > out/sheng-systemd-boot-no-clear.source-revision
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-systemd-boot-no-clear
          path: |
            out/sheng-systemd-boot-no-clear/BOOTAA64.EFI
            out/sheng-systemd-boot-no-clear.sha256
            out/sheng-systemd-boot-no-clear.source-revision
          if-no-files-found: error
