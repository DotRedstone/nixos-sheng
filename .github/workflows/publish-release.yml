# ---
# Module: Release Workflow
# Description: GitHub Actions workflow to publish a GitHub release
# Scope: CI
# ---

name: Publish Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g., v0.3.0)"
        required: true
        default: "v0.3.0"
      release_name:
        description: "Release name"
        required: true
        default: "NixOS Sheng v0.3.0 (kernel 7.1.8)"
      kernel_run_id:
        description: "Run ID for the kernel build (leave empty for latest)"
        required: false
      minimal_rootfs_run_id:
        description: "Run ID for the minimal rootfs build"
        required: true
      gnome_rootfs_run_id:
        description: "Run ID for the GNOME rootfs build"
        required: true

jobs:
  release:
    name: Publish Combined Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install release packaging tools
        run: |
          sudo apt update
          sudo apt install -y e2fsprogs zip

      - name: Determine Release Info
        id: release_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_NAME: ${{ inputs.release_name }}
          INPUT_KERNEL_RUN: ${{ inputs.kernel_run_id }}
          INPUT_MINIMAL_ROOTFS_RUN: ${{ inputs.minimal_rootfs_run_id }}
          INPUT_GNOME_ROOTFS_RUN: ${{ inputs.gnome_rootfs_run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$INPUT_TAG$INPUT_NAME" in
            *$'\n'*) echo "Release tag and name must be single-line values" >&2; exit 1 ;;
          esac

          {
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              printf 'tag=%s\n' "$INPUT_TAG"
              printf 'name=%s\n' "$INPUT_NAME"
              printf 'kernel_run=%s\n' "$INPUT_KERNEL_RUN"
              printf 'minimal_rootfs_run=%s\n' "$INPUT_MINIMAL_ROOTFS_RUN"
              printf 'gnome_rootfs_run=%s\n' "$INPUT_GNOME_ROOTFS_RUN"
            else
              printf 'tag=%s\n' "$REF_NAME"
              printf 'name=NixOS Sheng %s (kernel 7.1.8)\n' "$REF_NAME"
              printf 'kernel_run=\n'
              printf 'minimal_rootfs_run=\n'
              printf 'gnome_rootfs_run=\n'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts using gh CLI
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          : > release-artifacts/rootfs-runs.env
          expected_sha="${{ github.sha }}"
          requested_kernel_run="${{ steps.release_info.outputs.kernel_run }}"
          if [ -n "$requested_kernel_run" ]; then
            expected_sha="$(gh run view "$requested_kernel_run" --json headSha -q .headSha)"
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid release commit SHA: $expected_sha" >&2
            exit 1
          }
          echo "Expected artifact SHA: $expected_sha"
          printf 'head_sha=%s\n' "$expected_sha" >> "$GITHUB_OUTPUT"

          # License, notices, and release metadata must come from the same
          # reviewed commit as every binary artifact, even when a manual run
          # selects an older successful build.
          git fetch --no-tags origin "$expected_sha"
          git checkout --detach "$expected_sha"

          find_run_with_artifact() {
            workflow="$1"
            artifact="$2"
            while read -r run_id; do
              if gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[].name' | grep -Fxq "$artifact"; then
                echo "$run_id"
                return 0
              fi
            done < <(
              gh run list --workflow="$workflow" --status=success --limit=30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$expected_sha\") | .databaseId"
            )
            return 1
          }

          KERNEL_RUN="${{ steps.release_info.outputs.kernel_run }}"
          if [ -z "$KERNEL_RUN" ]; then
            KERNEL_RUN="$(find_run_with_artifact kernel.yml sheng-mobile-nixos-boot)"
          fi
          kernel_sha="$(gh run view "$KERNEL_RUN" --json headSha -q .headSha)"
          test "$kernel_sha" = "$expected_sha" || {
            echo "Kernel run $KERNEL_RUN belongs to $kernel_sha, expected $expected_sha"
            exit 1
          }
          echo "Downloading kernel from run $KERNEL_RUN"
          gh run download "$KERNEL_RUN" --dir release-artifacts/boot

          for flavor in minimal gnome; do
            if [ "$flavor" = "minimal" ]; then
              ROOTFS_RUN="${{ steps.release_info.outputs.minimal_rootfs_run }}"
              artifact="nixos-sheng-rootfs-mobileRootfsImage"
            else
              ROOTFS_RUN="${{ steps.release_info.outputs.gnome_rootfs_run }}"
              artifact="nixos-sheng-rootfs-mobileRootfsImageGnome"
            fi
            if [ -z "$ROOTFS_RUN" ]; then
              ROOTFS_RUN="$(find_run_with_artifact nixos-rootfs.yml "$artifact")"
            fi
            test -n "$ROOTFS_RUN" || {
              echo "A $flavor rootfs run ID is required"
              exit 1
            }
            rootfs_sha="$(gh run view "$ROOTFS_RUN" --json headSha -q .headSha)"
            test "$rootfs_sha" = "$expected_sha" || {
              echo "$flavor rootfs run $ROOTFS_RUN belongs to $rootfs_sha, expected $expected_sha"
              exit 1
            }
            echo "Downloading $flavor rootfs from run $ROOTFS_RUN"
            case "$flavor" in
              minimal)
                echo "MINIMAL_ROOTFS_RUN=$ROOTFS_RUN" >> release-artifacts/rootfs-runs.env
                ;;
              gnome)
                echo "GNOME_ROOTFS_RUN=$ROOTFS_RUN" >> release-artifacts/rootfs-runs.env
                ;;
            esac
          done

      - name: Prepare directly flashable files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.release_info.outputs.name }}
          RELEASE_SHA: ${{ steps.artifacts.outputs.head_sha }}
        run: |
          set -euo pipefail

          tag="${{ steps.release_info.outputs.tag }}"
          kernel_version="$(
            sed -n 's/^[[:space:]]*version = "\([^"]*\)";/\1/p' \
              nixos/hardware/xiaomi-sheng/kernel/default.nix | head -1
          )"
          test -n "$kernel_version"
          prefix="nixos-sheng-${tag}-kernel-${kernel_version}"
          mkdir -p release-upload

          boot_img="$(find release-artifacts/boot -type f -name '*.img' -print -quit)"
          if [ -z "$boot_img" ]; then
            echo "No boot image found in the selected kernel run"
            exit 1
          fi
          cp "$boot_img" "release-upload/${prefix}-boot.img"

          # Shrink each ext4 filesystem to its used size so it is convenient to
          # download. Stage-1 expands it to the linux partition on first boot.
          #
          # Rootfs images are published as split ZIP archives instead of raw
          # .img.part-* files. This is friendlier for Windows users: Bandizip,
          # 7-Zip, and similar tools can open the final .zip volume and extract
          # the directly flashable .img.
          max_zip_part_size="1900m"
          . release-artifacts/rootfs-runs.env
          for flavor in minimal gnome; do
            if [ "$flavor" = "minimal" ]; then
              ROOTFS_RUN="$MINIMAL_ROOTFS_RUN"
            else
              ROOTFS_RUN="$GNOME_ROOTFS_RUN"
            fi
            rootfs_dir="release-artifacts/rootfs-$flavor"
            rm -rf "$rootfs_dir"
            mkdir -p "$rootfs_dir"
            echo "Downloading $flavor rootfs from run $ROOTFS_RUN"
            gh run download "$ROOTFS_RUN" --dir "$rootfs_dir"
            rootfs_img="$(find "$rootfs_dir" -type f -name '*.img' -print -quit)"
            test -n "$rootfs_img" || {
              echo "No $flavor rootfs image found"
              exit 1
            }
            output="release-upload/${prefix}-rootfs-${flavor}.img"
            mv "$rootfs_img" "$output"
            rm -rf "$rootfs_dir"
            set +e
            e2fsck -fy "$output"
            fsck_status=$?
            set -e
            if [ "$fsck_status" -gt 1 ]; then
              echo "e2fsck failed for $flavor rootfs with status $fsck_status"
              exit "$fsck_status"
            fi
            resize2fs -M "$output"
            block_count="$(dumpe2fs -h "$output" 2>/dev/null | awk -F: '/Block count:/ { gsub(/ /, "", $2); print $2 }')"
            block_size="$(dumpe2fs -h "$output" 2>/dev/null | awk -F: '/Block size:/ { gsub(/ /, "", $2); print $2 }')"
            truncate -s "$((block_count * block_size))" "$output"

            (
              cd release-upload
              image_name="$(basename "$output")"
              archive_name="${image_name%.img}.zip"
              echo "Creating split ZIP archive for $image_name"
              zip -9 -s "$max_zip_part_size" "$archive_name" "$image_name"
              rm "$image_name"
            )
          done

          cp LICENSE THIRD_PARTY_NOTICES.md release-upload/

          cd release-upload
          sha256sum -- ./* > sha256sums.txt
          cd ..

          notes_file="docs/releases/${tag}.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-body.md
          else
            cat > release-body.md <<EOF
          This release contains the boot image, minimal rootfs, optional GNOME
          rootfs, checksums, license, and third-party notices for Xiaomi Pad 6S
          Pro 12.4 (sheng).
          EOF
          fi

          cat >> release-body.md <<EOF

          ## Build provenance

          All release artifacts were built from commit \`$RELEASE_SHA\`.
          The boot image, minimal rootfs, and GNOME rootfs workflow runs were
          required to report that exact commit before publication.
          EOF

      - name: Create Combined Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ steps.artifacts.outputs.head_sha }}
          name: ${{ steps.release_info.outputs.name }}
          files: release-upload/*
          draft: false
          prerelease: false
          body_path: release-body.md
