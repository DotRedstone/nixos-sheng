# ---
# Module: Release Workflow
# Description: GitHub Actions workflow to publish a GitHub release
# Scope: CI
# ---

name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g., v0.1.0-alpha.1)"
        required: true
        default: "v0.1.0-alpha.1"
      release_name:
        description: "Release name"
        required: true
        default: "Sheng v0.1.0-alpha.1"
      kernel_run_id:
        description: "Run ID for the kernel build (leave empty for latest)"
        required: false
      rootfs_run_id:
        description: "Run ID for the rootfs build (leave empty for latest)"
        required: false

jobs:
  release:
    name: Publish Combined Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Release Info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
            echo "kernel_run=${{ github.event.inputs.kernel_run_id }}" >> $GITHUB_OUTPUT
            echo "rootfs_run=${{ github.event.inputs.rootfs_run_id }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Sheng ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "kernel_run=" >> $GITHUB_OUTPUT
            echo "rootfs_run=" >> $GITHUB_OUTPUT
          fi

          # Auto prerelease if tag contains alpha/beta/rc
          if [[ "${{ github.ref_name }}" == *"alpha"* ]] || [[ "${{ github.ref_name }}" == *"beta"* ]] || [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts using gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts

          KERNEL_RUN="${{ steps.release_info.outputs.kernel_run }}"
          if [ -z "$KERNEL_RUN" ]; then
            KERNEL_RUN=$(gh run list --workflow=kernel.yml --status=success --limit=1 --json databaseId -q ".[0].databaseId")
          fi
          echo "Downloading kernel from run $KERNEL_RUN"
          gh run download "$KERNEL_RUN" --dir release-artifacts/boot

          ROOTFS_RUN="${{ steps.release_info.outputs.rootfs_run }}"
          if [ -z "$ROOTFS_RUN" ]; then
            ROOTFS_RUN=$(gh run list --workflow=nixos-rootfs.yml --status=success --limit=1 --json databaseId -q ".[0].databaseId")
          fi
          echo "Downloading rootfs from run $ROOTFS_RUN"
          gh run download "$ROOTFS_RUN" --dir release-artifacts/rootfs

      - name: Compress and prepare files
        run: |
          set -euo pipefail

          tag="${{ steps.release_info.outputs.tag }}"
          mkdir -p release-upload

          boot_img="$(find release-artifacts/boot -type f -name '*.img' -print -quit)"
          if [ -z "$boot_img" ]; then
            echo "No boot image found in the selected kernel run"
            exit 1
          fi
          cp "$boot_img" "release-upload/sheng-${tag}-boot.img"

          rootfs_img="$(find release-artifacts/rootfs -type f -name '*.img' -print -quit)"
          if [ -z "$rootfs_img" ]; then
            echo "No rootfs image found in the selected rootfs run"
            exit 1
          fi

          case "$rootfs_img" in
            *mobileRootfsImageGnome*) flavor="gnome" ;;
            *) flavor="minimal" ;;
          esac
          echo "Compressing $rootfs_img..."
          zstd -T0 -10 "$rootfs_img" -o "release-upload/sheng-${tag}-rootfs-${flavor}.img.zst"

          cd release-upload
          sha256sum * > sha256sums.txt
          cd ..

      - name: Create Combined Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          files: release-upload/*
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' || github.event_name == 'workflow_dispatch' }}
          body_path: docs/release-notes.md
