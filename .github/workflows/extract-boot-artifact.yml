# ---
# Module: Boot Artifact Extraction Workflow
# Description: Repackage a verified boot image without the matching module archive
# Scope: CI
# ---

name: Extract Sheng Boot Artifact

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Successful kernel workflow run ID"
        required: true
        type: string

jobs:
  extract:
    name: Extract verified boot image
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: sheng-mobile-nixos-boot
          path: kernel-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and select boot image
        run: |
          set -euo pipefail
          cd kernel-artifact
          sha256sum -c sha256sums.txt
          test -f boot_sheng_nixos.img
          mkdir -p ../boot-only
          cp boot_sheng_nixos.img ../boot-only/
          sha256sum boot_sheng_nixos.img > ../boot-only/sha256sums.txt

      - name: Upload boot-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheng-mobile-nixos-boot-only
          path: boot-only/
          retention-days: 14
