# ---
# Module: RootFS Build Workflow
# Description: GitHub Actions workflow to build the NixOS root filesystem
# Scope: CI
# ---

name: Build NixOS RootFS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: "RootFS image size, or auto for computed full ext4 size"
        required: true
        default: "auto"
      rootfs_flake_attr:
        description: "RootFS flake output to build"
        required: true
        type: choice
        options:
          - mobileRootfsImage
          - mobileRootfsImageGnome
        default: "mobileRootfsImage"
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: true
      username:
        description: "Default non-root username"
        required: false
        default: "luser"
      user_password_hash:
        description: "Strong crypt hash for the non-root user (mkpasswd -m yescrypt)"
        required: true
        type: string
      root_password_hash:
        description: "Strong crypt hash for root (mkpasswd -m yescrypt)"
        required: true
        type: string

jobs:
  build:
    name: Build selected NixOS rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install -y e2fsprogs gh xz-utils zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Inject dynamic credentials
        env:
          INPUT_USERNAME: ${{ inputs.username }}
          INPUT_USER_PASSWORD_HASH: ${{ inputs.user_password_hash }}
          INPUT_ROOT_PASSWORD_HASH: ${{ inputs.root_password_hash }}
        run: |
          set -euo pipefail
          case "$INPUT_USER_PASSWORD_HASH" in
            '$'*) ;;
            *) echo "User password must be supplied as a crypt hash" >&2; exit 1 ;;
          esac
          case "$INPUT_ROOT_PASSWORD_HASH" in
            '$'*) ;;
            *) echo "Root password must be supplied as a crypt hash" >&2; exit 1 ;;
          esac

          username_json="$(jq -Rn --arg value "$INPUT_USERNAME" '$value')"
          user_hash_json="$(jq -Rn --arg value "$INPUT_USER_PASSWORD_HASH" '$value')"
          root_hash_json="$(jq -Rn --arg value "$INPUT_ROOT_PASSWORD_HASH" '$value')"
          cat <<EOF > nixos/vars.nix
          {
            username = $username_json;
            userPassword = null;
            rootPassword = null;
            userPasswordHash = $user_hash_json;
            rootPasswordHash = $root_hash_json;
            publicTestImage = true;
          }
          EOF

      - name: Validate installed stage-2 configuration
        run: |
          case "${{ github.event.inputs.rootfs_flake_attr }}" in
            mobileRootfsImageGnome)
              configuration="sheng"
              ;;
            mobileRootfsImage)
              configuration="sheng-minimal"
              ;;
            *)
              echo "Unsupported rootfs output: ${{ github.event.inputs.rootfs_flake_attr }}"
              exit 1
              ;;
          esac

          nix --extra-experimental-features "nix-command flakes" \
            build "./nixos#nixosConfigurations.${configuration}.config.system.build.toplevel" \
            --no-link \
            --fallback

      - name: Build image
        run: |
          chmod +x build-nixos-rootfs.sh
          sudo env "PATH=$PATH" "NIX_PATH=$NIX_PATH" IMAGE_SIZE="${{ github.event.inputs.image_size }}" ROOTFS_FLAKE_ATTR="${{ github.event.inputs.rootfs_flake_attr }}" ./build-nixos-rootfs.sh

      - name: Verify rootfs integrity features
        run: |
          set -euo pipefail

          image="$(find out -maxdepth 1 -type f -name 'nixos-sheng-*.img' -print -quit)"
          test -n "$image"
          sudo e2fsck -fn "$image"

          features="$(sudo dumpe2fs -h "$image" 2>/dev/null | awk -F: '/Filesystem features/ { print $2 }')"
          echo "Filesystem features:$features"
          for feature in metadata_csum 64bit dir_index; do
            grep -qw "$feature" <<<"$features" || {
              echo "ERROR: rootfs is missing required ext4 feature: $feature" >&2
              exit 1
            }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixos-sheng-rootfs-${{ github.event.inputs.rootfs_flake_attr }}
          path: out/nixos-sheng-*.img
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-rootfs-${{ github.run_number }}
          name: "NixOS Sheng RootFS ${{ github.run_number }}"
          files: out/nixos-sheng-*.img
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
