name: Build NixOS RootFS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: "RootFS image size, or auto for Mobile NixOS computed size"
        required: true
        default: "auto"
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: false

jobs:
  build:
    name: Build NixOS console rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install -y e2fsprogs gh unzip xz-utils zip zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build image
        run: |
          chmod +x build-nixos-rootfs.sh
          sudo env "PATH=$PATH" "NIX_PATH=$NIX_PATH" IMAGE_SIZE="${{ github.event.inputs.image_size }}" ./build-nixos-rootfs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-sheng-rootfs
          path: out/nixos-sheng-*.img.zip
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-rootfs-${{ github.run_number }}
          name: "NixOS Sheng RootFS ${{ github.run_number }}"
          files: out/nixos-sheng-*.img.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
