name: Build NixOS RootFS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: "RootFS image size"
        required: true
        default: "8G"
      kernel_release_tag:
        description: "Optional kernel release tag to inject, for example kernel-7.1"
        required: false
        default: ""
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: false

jobs:
  build:
    name: Build NixOS console rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install -y e2fsprogs gh p7zip-full xz-utils zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download kernel artifacts
        if: ${{ github.event.inputs.kernel_release_tag != '' }}
        run: |
          mkdir -p artifacts
          gh release download "${{ github.event.inputs.kernel_release_tag }}" \
            --pattern "*.tar.zst" \
            --dir artifacts \
            --repo "${{ github.repository }}" \
            --clobber
          for archive in artifacts/*.tar.zst; do
            tar --zstd -xf "$archive" -C artifacts
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          chmod +x build-nixos-rootfs.sh
          sudo env "PATH=$PATH" "NIX_PATH=$NIX_PATH" IMAGE_SIZE="${{ github.event.inputs.image_size }}" ./build-nixos-rootfs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-sheng-rootfs
          path: out/nixos-sheng-*.img.7z
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-rootfs-${{ github.run_number }}
          name: "NixOS Sheng RootFS ${{ github.run_number }}"
          files: out/nixos-sheng-*.img.7z
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
