name: Build NixOS RootFS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: "RootFS image size, or auto for computed full ext4 size"
        required: true
        default: "auto"
      rootfs_flake_attr:
        description: "RootFS flake output to build"
        required: true
        type: choice
        options:
          - mobileRootfsImage
          - mobileRootfsImageGnome
        default: "mobileRootfsImage"
      skip_release:
        description: "Skip GitHub release"
        type: boolean
        default: true
      username:
        description: "Default non-root username"
        required: false
        default: "luser"
      user_password:
        description: "Password for the non-root user"
        required: false
        default: "1"
      root_password:
        description: "Password for the root user"
        required: false
        default: "123456"

jobs:
  build:
    name: Build NixOS console rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install -y e2fsprogs gh xz-utils zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Inject dynamic credentials
        run: |
          cat <<EOF > nixos/vars.nix
          {
            username = "${{ github.event.inputs.username || 'luser' }}";
            userPassword = "${{ github.event.inputs.user_password || '1' }}";
            rootPassword = "${{ github.event.inputs.root_password || '123456' }}";
          }
          EOF

      - name: Validate installed stage-2 configuration
        run: |
          case "${{ github.event.inputs.rootfs_flake_attr }}" in
            mobileRootfsImageGnome)
              configuration="sheng"
              ;;
            mobileRootfsImage)
              configuration="sheng-minimal"
              ;;
            *)
              echo "Unsupported rootfs output: ${{ github.event.inputs.rootfs_flake_attr }}"
              exit 1
              ;;
          esac

          nix --extra-experimental-features "nix-command flakes" \
            build "./nixos#nixosConfigurations.${configuration}.config.system.build.toplevel" \
            --no-link

      - name: Build image
        run: |
          chmod +x build-nixos-rootfs.sh
          sudo env "PATH=$PATH" "NIX_PATH=$NIX_PATH" IMAGE_SIZE="${{ github.event.inputs.image_size }}" ROOTFS_FLAKE_ATTR="${{ github.event.inputs.rootfs_flake_attr }}" ./build-nixos-rootfs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-sheng-rootfs-${{ github.event.inputs.rootfs_flake_attr }}
          path: out/nixos-sheng-*.img
          retention-days: 14

      - name: Create release
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-rootfs-${{ github.run_number }}
          name: "NixOS Sheng RootFS ${{ github.run_number }}"
          files: out/nixos-sheng-*.img
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
