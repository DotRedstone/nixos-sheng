name: Build Sheng U-Boot EFI boot image

on:
  push:
    branches:
      - exp/uboot-efi
    paths:
      - nixos/flake.nix
      - nixos/packages/sheng-uboot-android-bootimg.nix
      - nixos/packages/sheng-uboot.env
      - nixos/patches/u-boot/**
      - .github/workflows/sheng-uboot-efi-bootimg.yml
  pull_request:
    paths:
      - nixos/flake.nix
      - nixos/packages/sheng-uboot-android-bootimg.nix
      - nixos/packages/sheng-uboot.env
      - nixos/patches/u-boot/**
      - .github/workflows/sheng-uboot-efi-bootimg.yml
  workflow_dispatch:

jobs:
  build-efi-boot-image:
    name: Build experimental U-Boot boot_b image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build U-Boot Android boot image
        run: |
          nix build ./nixos#shengUbootAndroidBootimg \
            --print-build-logs \
            --out-link out/sheng-u-boot-experimental-boot_b.img
          file out/sheng-u-boot-experimental-boot_b.img
          sha256sum out/sheng-u-boot-experimental-boot_b.img > out/sheng-u-boot-experimental-boot_b.img.sha256
      - name: Upload experimental boot image
        uses: actions/upload-artifact@v4
        with:
          name: sheng-u-boot-experimental-boot_b
          path: |
            out/sheng-u-boot-experimental-boot_b.img
            out/sheng-u-boot-experimental-boot_b.img.sha256
          if-no-files-found: error
