# Experimental upstream-kernel bring-up. Never publishes a release or flashes a device.
name: Validate Sheng 7.3 CS35L43_STANDBY Candidate

on:
  push:
    branches:
      - exp/7.3-cs35l43-standby-validation
    paths:
      - "nixos/**"
      - ".github/workflows/upstream-73-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Build 7.3 cs35l43-standby boot image and matching modules
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate pinned upstream kernel input
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the isolated cs35l43-standby kernel ref; upload the resulting
          # lock to permit committing the immutable NAR hash after CI verifies it.
          nix flake lock --update-input shengKernelSrc ./nixos
          jq -e '.nodes.shengKernelSrc.original.ref == "contrib/sheng-cs35l43-standby-20261022"' nixos/flake.lock
          jq -e '.nodes.shengKernelSrc.locked.rev != "9ce9cb0e1543980f85f5a44c074e44c569cf793d"' nixos/flake.lock
          jq -r '.nodes.shengKernelSrc.locked | "candidate kernel: \(.owner)/\(.repo) @ \(.rev), NAR \(.narHash)"' nixos/flake.lock

      - name: Build experimental Mobile NixOS boot image
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/baseline
          # Capture the entire Nix build output rather than only the last 25 lines.
          set +e
          nix build -L ./nixos#mobileAndroidBootimg --out-link out/mobile-bootimg --fallback \
            2>&1 | tee out/baseline/nix-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            drv="$(grep -oE '/nix/store/[a-z0-9]+-linux-7\.3\.0\.drv' out/baseline/nix-build.log | tail -1 || true)"
            if [ -n "$drv" ]; then
              echo "===== Full kernel builder log: $drv ====="
              nix log "$drv" > out/baseline/kernel-builder.log 2>&1 || true
              grep -nEi -C 8 'fatal error:|error:|undefined reference|No rule to make target|Error [0-9]+|FAILED|Killed process' \
                out/baseline/kernel-builder.log | tail -260 || true
              echo "===== Final kernel builder lines ====="
              tail -180 out/baseline/kernel-builder.log || true
            else
              echo "No linux-7.3.0 derivation found; see nix-build.log"
            fi
            exit "$status"
          fi
          cp -L out/mobile-bootimg out/baseline/boot_sheng_7.3_CS35L43_STANDBY_EXPERIMENT.img

      - name: Package kernel modules matching the boot image
        shell: bash
        run: |
          set -euo pipefail
          nix build './nixos#nixosConfigurations.sheng.config.boot.kernelPackages.kernel' --out-link out/kernel-package --fallback
          modver="$(nix eval './nixos#nixosConfigurations.sheng.config.boot.kernelPackages.kernel.modDirVersion' --raw)"
          test -d "out/kernel-package/lib/modules/$modver"
          tar -C out/kernel-package/lib/modules -czf "out/baseline/modules-$modver-EXPERIMENT.tar.gz" "$modver"
          sha256sum out/baseline/boot_sheng_7.3_CS35L43_STANDBY_EXPERIMENT.img out/baseline/modules-*.tar.gz > out/baseline/SHA256SUMS
          {
            echo 'EXPERIMENTAL upstream-7.3 bring-up only.'
            echo 'NOT a complete flashable release.'
            echo 'The stage-2 rootfs modules MUST match the experimental kernel.'
            echo 'Fingerprints, THP stylus, and Xiaomi MiPPS features may be absent or incompatible.'
            echo 'Do not flash until you have a known-good boot backup and recovery route.'
            echo 'Kernel source: DotRedstone/linux-sheng contrib/sheng-cs35l43-standby-20261022 (upstream baseline 9ce9cb0e plus cs35l43-standby candidate only)'
          } > out/baseline/READ_ME_FIRST.txt

      - name: Upload logs (including failed builds)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sheng-7.3-cs35l43-standby-build-logs
          path: |
            out/baseline/nix-build.log
            out/baseline/kernel-builder.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build-only experimental artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sheng-7.3-cs35l43-standby-UNVERIFIED
          path: out/baseline/
          retention-days: 14

      - name: Upload resolved flake lock for follow-up commit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sheng-7.3-cs35l43-standby-resolved-flake-lock
          path: nixos/flake.lock
          retention-days: 14

      # Flashable GNOME stage-2 is built from the SAME resolved kernel flake
      # input as the boot image. Public test image uses the repository's
      # disposable luser auto-login profile, not private user credentials.
      - name: Build matching GNOME rootfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zstd e2fsprogs
          nix build -L ./nixos#mobileRootfsImageGnome --out-link out/gnome-rootfs --fallback
          img="$(find -L out/gnome-rootfs -type f -name rootfs.img -print -quit)"
          test -n "$img"
          sudo e2fsck -fn "$img"
          version="$(nix eval './nixos#nixosConfigurations.sheng.config.boot.kernelPackages.kernel.modDirVersion' --raw)"
          mountpoint="$(mktemp -d)"
          cleanup() {
            if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi
            rmdir "$mountpoint"
          }
          trap cleanup EXIT
          sudo mount -o loop,ro "$img" "$mountpoint"
          test -d "$mountpoint/lib/modules/$version" || {
            echo "ERROR: rootfs lacks module tree $version" >&2
            exit 1
          }
          test -e "$mountpoint/nix-path-registration" || {
            echo "ERROR: rootfs missing Nix closure registration" >&2
            exit 1
          }
          echo "rootfs version $version matches boot kernel"
          sudo umount "$mountpoint"
          mkdir -p out/full
          zstd -T0 -3 --check -f "$img" -o "out/full/sheng-7.3-cs35l43-standby-gnome.img.zst"
          zstd -t "out/full/sheng-7.3-cs35l43-standby-gnome.img.zst"
          (cd out/full && sha256sum *.img.zst > SHA256SUMS)

      - name: Upload matching GNOME rootfs without ZIP wrapper
        uses: actions/upload-artifact@v7
        with:
          path: out/full/sheng-7.3-cs35l43-standby-gnome.img.zst
          archive: false
          retention-days: 14

      - name: Upload GNOME rootfs checksums
        uses: actions/upload-artifact@v7
        with:
          path: out/full/SHA256SUMS
          archive: false
          retention-days: 14
